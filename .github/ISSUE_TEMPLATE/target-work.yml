name: Target work
description: File work for Studio to run a Cursor Cloud agent on an allowlisted repo
labels: []
body:
  - type: markdown
    attributes:
      value: |
        After filing, add a label:
        - `repo:pad-lab` / `repo:studio` / … from `repos.yaml`
        - `new:go-service` to create from the Go template
        Optional: `skip-qc`, `skip-review`, or `model:grok-4.6` / `model:grok-4.5` / `model:composer-2.5` (included pool only)
  - type: textarea
    id: summary
    attributes:
      label: What to do
      description: Small, testable scope. Intake QC runs first unless you add skip-qc.
      placeholder: Fix X so that Y…
    validations:
      required: true
  - type: input
    id: new_repo_name
    attributes:
      label: New repo name
      description: Only for `new:` labels. Leave blank to slugify the title.
      placeholder: notes-api
    validations:
      required: false
  - type: dropdown
    id: model
    attributes:
      label: Cursor model
      description: Included Cursor Models pool only (cost). Override via label model:… if needed.
      options:
        - grok-4.6
        - grok-4.5
        - composer-2.5
      default: 0
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      placeholder: |
        - …
    validations:
      required: false
