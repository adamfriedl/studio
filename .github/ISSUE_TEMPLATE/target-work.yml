name: Target work
description: File work for Studio to run a Cursor Cloud agent on an allowlisted repo
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Add a label after filing:
        - `repo:pad-lab` / `repo:studio` / … from `repos.yaml`
        - `new:go-service` to create a repo from the Go template
  - type: textarea
    id: summary
    attributes:
      label: What to do
      description: Small, testable scope. Studio will open a draft PR on the target.
      placeholder: Fix X so that Y…
    validations:
      required: true
  - type: input
    id: new_repo_name
    attributes:
      label: New repo name
      description: Only for `new:` labels. GitHub repo name (e.g. notes-api). Leave blank to slugify the issue title.
      placeholder: notes-api
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Done when
      placeholder: |
        - …
    validations:
      required: false
