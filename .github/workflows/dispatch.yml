name: dispatch

on:
  # Only "labeled" — not "opened". Open then add repo:/new: → one run.
  # Adding working/pr-open also fires labeled, but the job if skips those.
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Studio issue number
        required: true
        type: number

concurrency:
  group: studio-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    # Skip noise labels (working, pr-open, needs-human, …) at the job gate —
    # no checkout / npm / agent. Manual workflow_dispatch always runs.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' &&
       github.event.issue.state == 'open' &&
       (startsWith(github.event.label.name, 'repo:') ||
        startsWith(github.event.label.name, 'new:') ||
        github.event.label.name == 'spec-ok' ||
        github.event.label.name == 'skip-qc'))
    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub App token (preferred)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.STUDIO_APP_ID }}
          private-key: ${{ secrets.STUDIO_APP_PRIVATE_KEY }}
          owner: adamfriedl
          # Omit repositories: token covers whatever the install can see.
          # Prefer App install = All repositories so Phase 4 new repos work
          # without editing this workflow (catalog still gates dispatch).

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/cursor-helper/package-lock.json

      - name: Install cursor helper deps
        working-directory: scripts/cursor-helper
        run: npm ci

      - name: Resolve issue number
        id: issue
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "n=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "n=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: studio dispatch
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          STUDIO_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.STUDIO_GITHUB_TOKEN }}
          # Classic PAT — used only for new: template generate if the App lacks administration.
          STUDIO_GITHUB_PAT: ${{ secrets.STUDIO_GITHUB_TOKEN }}
          STUDIO_CURSOR_MODEL: grok-4.6
          STUDIO_QC_MODEL: grok-4.6
          STUDIO_REVIEW_MODEL: grok-4.6
        run: go run ./cmd/studio dispatch --issue "${{ steps.issue.outputs.n }}"
