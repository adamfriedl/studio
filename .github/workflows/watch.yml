name: watch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: Optional single issue (empty = all pr-open)
        required: false
        type: string
  repository_dispatch:
    types: [studio-ci-failed, studio-pr-merged]

concurrency:
  # One watch at a time — schedule + repository_dispatch must not race the same issue.
  group: studio-watch
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Mint GitHub App token (preferred)
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.STUDIO_APP_ID }}
          private-key: ${{ secrets.STUDIO_APP_PRIVATE_KEY }}
          owner: adamfriedl
          # Omit repositories — see docs/github-app.md (All repositories install).

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: scripts/cursor-helper/package-lock.json

      - name: Install cursor helper deps
        working-directory: scripts/cursor-helper
        run: npm ci

      - name: Resolve issue arg
        id: args
        run: |
          N=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            N="${{ inputs.issue_number }}"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            N="${{ github.event.client_payload.issue_number }}"
          fi
          if [ -n "$N" ]; then
            echo "flags=--issue $N" >> "$GITHUB_OUTPUT"
          else
            echo "flags=" >> "$GITHUB_OUTPUT"
          fi

      - name: studio watch
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          STUDIO_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.STUDIO_GITHUB_TOKEN }}
          STUDIO_CURSOR_MODEL: composer-2.5
          STUDIO_QC_MODEL: composer-2.5
          STUDIO_REVIEW_MODEL: composer-2.5
        run: go run ./cmd/studio watch ${{ steps.args.outputs.flags }}
